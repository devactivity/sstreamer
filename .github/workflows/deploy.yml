name: Deploy

# Cloudflare no longer offers a dashboard Git integration for Pages, so deploys go
# through Direct Upload instead. That is arguably better: nothing ships unless the
# tests and the schema validation pass first.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by sync-sheet.yml, because a push made with GITHUB_TOKEN does not
  # trigger other workflows and the synced content would otherwise never deploy.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to deploy. The caller must pass the commit it just pushed.'
        type: string
        required: false

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      # `github.sha` is the head from when the run started, so when sync-sheet.yml
      # calls this after committing, the default checkout predates its own commit
      # and would rebuild the site without the new content.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run check

      # Also validates every streamer and game file against the Zod schema.
      - name: Build
        run: npm run build

      - name: Record the commit being deployed
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch is what makes this a production deploy. Checking out a raw SHA
          # leaves a detached HEAD, so wrangler cannot read the branch from git and
          # would publish a preview that never reaches sstreamer.pages.dev.
          command: >-
            pages deploy dist --project-name=sstreamer
            --branch=main
            --commit-hash=${{ steps.rev.outputs.sha }}
            --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
