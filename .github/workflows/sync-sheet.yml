name: Sync submissions

# Cron has a 5 minute floor and drifts under load, so 15 minutes is the honest
# promise. The site copy tells streamers "live in about 15 minutes" to match.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without writing'
        type: boolean
        default: false

concurrency:
  # Two runs writing YAML at once would race on the same files.
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Pull submissions
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_RANGE: ${{ vars.SHEET_RANGE }}
        run: node scripts/sync-sheet.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # Validates the incoming data against the Zod schema. A malformed submission
      # fails here rather than publishing a broken page.
      - name: Verify the site still builds
        run: npm run build

      - name: Commit changes
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain src/data)" ]; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Sync streamer submissions"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # The deploy job checks this out. Without it, it would build the tree as
          # it stood before this commit and publish nothing new.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN deliberately does not trigger other workflows,
  # so synced content would sit in the repo undeployed. Call the deploy directly.
  deploy:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' }}
    # A called workflow cannot request more than the calling job holds, and this
    # job would otherwise fall back to the repo default (read-only). Must cover
    # everything deploy.yml asks for, or the whole file fails validation.
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
    secrets: inherit
