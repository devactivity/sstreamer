name: CI

# Only pull requests: pushes to main are covered by deploy.yml, which runs the same
# checks before shipping. Running both would just duplicate every job.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Types
        run: npm run check

      # Also acts as schema validation: a malformed streamer YAML fails the build.
      - name: Build
        run: npm run build
